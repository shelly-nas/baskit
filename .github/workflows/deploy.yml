name: Baskit Build, Push & Deploy

# Every push to main builds the images on the NAS runner, pushes them to the
# registry and redeploys the production stack (same flow as supermarket-scraper).
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-web:
    name: Build and Push Web
    uses: shelly-nas/shared-workflows/.github/workflows/build-push-image.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/baskit-web:latest
      context: .
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  build-server:
    name: Build and Push Server
    uses: shelly-nas/shared-workflows/.github/workflows/build-push-image.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/baskit-server:latest
      context: ./server
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  build-db:
    name: Build and Push Database
    uses: shelly-nas/shared-workflows/.github/workflows/build-push-image.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/baskit-db:latest
      context: ./database
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  deploy:
    name: Deploy from Registry
    needs: [build-web, build-server, build-db]
    if: ${{ success() }}
    uses: shelly-nas/shared-workflows/.github/workflows/deploy-production.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      deploy_directory: /volume1/docker/baskit
      compose_file: docker-compose.prod.yml
      image_tag: latest
      # Fallback teardown of acc once what runs there is in production.
      acc_directory: /volume1/docker/baskit-acc
    secrets:
      registry_username: ${{ vars.REGISTRY_USERNAME }}
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}
      env_file_content: |
        DB_NAME=${{ vars.DB_NAME || 'baskit' }}
        DB_USER=${{ vars.DB_USER || 'baskit' }}
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        JWT_SECRET=${{ secrets.JWT_TOKEN || vars.JWT_TOKEN }}
        ADMIN_EMAILS=${{ vars.ADMIN_EMAILS }}
        TZ=${{ vars.TZ || 'Europe/Amsterdam' }}
