name: Deploy to Acceptance

# Every pull request to main is built and deployed to baskit-acc.shelly-nas.nl,
# so the change can be tried in the running app before it is merged. There is
# one acc environment: the last pull request pushed is the one on it. "Run
# workflow" redeploys any branch by hand.
#
# Acc gets a fresh database on every deploy - database/init.sql plus the demo
# accounts and lists from database/seed-demo.sql - and never production data.
# Production keeps its own persistent database; nothing here touches it.
#
# When the pull request is merged or closed, acc is torn down - but only if it
# still runs that pull request.

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a deploy in progress; acc only ever shows one branch.
# A teardown never cancels a deploy: it waits its turn.
concurrency:
  group: acc-deploy
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  prepare:
    name: Decide whether to deploy
    runs-on: ubuntu-latest
    # Pull requests from forks never reach the self-hosted runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=acc-${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"

  build-web:
    name: Build and Push Web
    needs: prepare
    uses: shelly-nas/shared-workflows/.github/workflows/build-push-image.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/baskit-web:${{ needs.prepare.outputs.tag }}
      context: .
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  build-server:
    name: Build and Push Server
    needs: prepare
    uses: shelly-nas/shared-workflows/.github/workflows/build-push-image.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/baskit-server:${{ needs.prepare.outputs.tag }}
      context: ./server
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  build-db:
    name: Build and Push Database
    needs: prepare
    uses: shelly-nas/shared-workflows/.github/workflows/build-push-image.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/baskit-db:${{ needs.prepare.outputs.tag }}
      context: ./database
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  deploy-acc:
    name: Deploy to Acceptance
    needs: [prepare, build-web, build-server, build-db]
    uses: shelly-nas/shared-workflows/.github/workflows/deploy-acceptance.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      deploy_directory: /volume1/docker/baskit-acc
      compose_file: docker-compose.acc.yml
      image_tag: ${{ needs.prepare.outputs.tag }}
      demo_seed_file: database/seed-demo.sql
    secrets:
      registry_username: ${{ vars.REGISTRY_USERNAME }}
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}
      # Acc has its own token secret when JWT_TOKEN_ACC is set, so an acc
      # sign-in can never be valid on production.
      env_file_content: |
        DB_NAME=${{ vars.DB_NAME || 'baskit' }}
        DB_USER=${{ vars.DB_USER || 'baskit' }}
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        JWT_SECRET=${{ secrets.JWT_TOKEN_ACC || vars.JWT_TOKEN_ACC || secrets.JWT_TOKEN || vars.JWT_TOKEN }}
        ADMIN_EMAILS=admin@baskit.demo
        DISCOUNT_API_UPSTREAM=${{ vars.DISCOUNT_API_UPSTREAM_ACC || 'http://supermarket-scraper-acc-api:3001' }}
        TZ=${{ vars.TZ || 'Europe/Amsterdam' }}

  # The Gherkin scenarios in e2e/features run against the fresh acc. Playwright
  # runs in a container on shelly-network and reaches the web container by
  # name, so it does not depend on DNS or Traefik. Files go in and out with
  # docker cp: the runner may itself run in a container, so a bind mount of
  # the workspace would point at the wrong path.
  e2e-acc:
    name: E2E scenarios on acc
    needs: deploy-acc
    runs-on: shelly
    env:
      CONTAINER: baskit-acc-e2e-${{ github.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for acc
        run: |
          for i in $(seq 1 30); do
            if docker run --rm --network shelly-network curlimages/curl:8.11.1 \
                 -fsS -m 5 http://baskit-acc-web/api/health; then exit 0; fi
            sleep 5
          done
          echo "acc did not become healthy"; exit 1

      - name: Run scenarios
        run: |
          docker create --name "$CONTAINER" --network shelly-network --ipc=host \
            -e CI=1 -e BASE_URL=http://baskit-acc-web -w /e2e \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            sh -c "npm ci --no-audit --no-fund && npm test"
          docker cp e2e/. "$CONTAINER:/e2e"
          docker start -a "$CONTAINER"

      - name: Collect reports
        if: always()
        run: |
          rm -rf e2e-reports
          docker cp "$CONTAINER:/e2e/reports" e2e-reports || true
          docker rm -f "$CONTAINER" || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: e2e-reports
          if-no-files-found: ignore

  teardown-acc:
    name: Tear down acc
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: shelly-nas/shared-workflows/.github/workflows/teardown-acceptance.yml@main
    with:
      acc_directory: /volume1/docker/baskit-acc
      commit: ${{ github.event.pull_request.head.sha }}
