services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: baskit-postgres
    environment:
      POSTGRES_DB: baskit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seeds/01_initial_data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - baskit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and real-time messaging
  redis:
    image: redis:7-alpine
    container_name: baskit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - baskit-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # User Service
  user-service:
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    container_name: baskit-user-service
    environment:
      - PORT=3001
      - NODE_ENV=development
      - SERVICE_NAME=user-service
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=baskit
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - APP_URL=http://localhost:3000
      - FROM_EMAIL=noreply@baskit.app
      # SMTP Configuration (optional - leave empty to use Ethereal test account)
      # For production, configure with your SMTP provider (SendGrid, AWS SES, etc.)
      # - SMTP_HOST=smtp.example.com
      # - SMTP_PORT=587
      # - SMTP_SECURE=false
      # - SMTP_USER=your-smtp-user
      # - SMTP_PASS=your-smtp-password
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - baskit-network
    volumes:
      - ./backend/user-service/src:/app/src
      - ./backend/user-service/test:/app/test
      - ./backend/shared:/app/shared
      - /app/node_modules
    command: npm run dev

  # Product Service
  product-service:
    build:
      context: ./backend
      dockerfile: product-service/Dockerfile
    container_name: baskit-product-service
    environment:
      - PORT=3002
      - NODE_ENV=development
      - SERVICE_NAME=product-service
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=baskit
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - baskit-network
    volumes:
      - ./backend/product-service/src:/app/src
      - ./backend/shared:/app/shared
      - /app/node_modules
    command: npm run dev

  # List Service
  list-service:
    build:
      context: ./backend
      dockerfile: list-service/Dockerfile
    container_name: baskit-list-service
    environment:
      - PORT=3003
      - NODE_ENV=development
      - SERVICE_NAME=list-service
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=baskit
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - baskit-network
    volumes:
      - ./backend/list-service/src:/app/src
      - ./backend/shared:/app/shared
      - /app/node_modules
    command: npm run dev

