# Local development: Baskit web on http://localhost:8080 with its server and
# database. Discounts come from the supermarket-scraper project, which must run
# separately (its API on port 3001).
#   cp .env.example .env
#   docker compose up --build -d

services:
  db:
    build:
      context: database
    container_name: baskit-db
    environment:
      POSTGRES_DB: ${DB_NAME:-baskit}
      POSTGRES_USER: ${DB_USER:-baskit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-baskit}
    ports:
      - "5434:5432"
    volumes:
      - baskit_db:/var/lib/postgresql/data
      # Demo accounts and lists (password: baskit-demo) on a fresh volume.
      # Never part of the database image, so never in production.
      - ./database/seed-demo.sql:/docker-entrypoint-initdb.d/02-seed-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-baskit} -d ${DB_NAME:-baskit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: server
    container_name: baskit-server
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-baskit}
      DB_USER: ${DB_USER:-baskit}
      DB_PASSWORD: ${DB_PASSWORD:-baskit}
      SERVER_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-me-1234567890}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ports:
      - "3002:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baskit-web
    environment:
      # nginx proxies /api/discounts to <upstream>/api/public/v1 and /api to the server
      DISCOUNT_API_UPSTREAM: ${DISCOUNT_API_UPSTREAM:-http://host.docker.internal:3001}
      BASKIT_API_UPSTREAM: http://server:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  baskit_db:
